# Minimal container setup: Postgres and Redis are the two things the app
# fails fast without (see CLAUDE.md's "What this is"). RabbitMQ, Kafka, and
# Elasticsearch are included too, but as non-fatal dependencies —
# remittance.completed (see src/infra/events/) degrades to "the search-index
# update doesn't fire" rather than blocking boot or any write request if
# Kafka/Elasticsearch are unreachable; GET /remittances is the only thing
# that actually needs Elasticsearch. account.created is durable regardless
# of RabbitMQ being reachable (see the Transactional Outbox note on
# worker-outbox-relay below) — an unreachable broker there just means the
# simulated confirmation email is delayed until it's back, not lost. Mongo
# still exists in the codebase but isn't wired into any request path, so it
# stays left out here rather than shipped unused.
#
# Host-side ports below default away from each service's standard port
# (6380 not 6379, 5673/15673 not 5672/15672, 9094 not 9092, 9201 not 9200)
# on purpose — so `docker compose up` here doesn't collide with same-named
# services you might already have running elsewhere on the host (e.g. a
# separate local dev stack). The app always talks to these over the compose
# network on their standard ports regardless (see the `app` service's
# environment below) — only the host-side mapping is nonstandard.
#
# All values below can be overridden either via shell env vars or by
# dropping a `.env` file next to this compose file (docker compose loads it
# automatically for variable substitution).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DATABASE:-scaling_app}
    ports:
      # Host-side port only, for connecting a local psql/GUI client — the
      # app talks to postgres over the internal compose network regardless
      # (see POSTGRES_HOST=postgres below), so this defaults to a
      # non-standard port to avoid clashing with a Postgres already running
      # on the host's 5432. Override with POSTGRES_HOST_PORT if needed.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DATABASE:-scaling_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host-side port only, for connecting a local redis-cli — the app
      # talks to redis over the internal compose network regardless (see
      # REDIS_HOST=redis / REDIS_PORT=6379 below).
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_HOST_PORT:-5673}:5672"
      # Management UI, for poking at queues by hand (see the
      # account.created queue after a signup).
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-broker KRaft mode (no Zookeeper) — a dev/demo setup, not a
  # production cluster. Backs remittance.completed only (see
  # src/infra/events/kafka-event-publisher.ts).
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Advertises the HOST-mapped port (below), not the container's
      # internal 9092 — a client connecting from the host via
      # localhost:${KAFKA_HOST_PORT} needs the broker to hand back that same
      # address on subsequent connections, not the container-internal one.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Single-node, security disabled — a dev/demo setup. Backs GET
  # /remittances only (see src/infra/persistence/elasticsearch/).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9201}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not health-gated like postgres/redis above — see the top-of-file
      # comment on why RabbitMQ/Kafka/Elasticsearch being slow to become
      # healthy (or unreachable outright) shouldn't hold up app startup.
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-scaling_app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # kafka:29092 is the internal PLAINTEXT listener (see the kafka
      # service above) — not kafka:9092, which is only advertised for
      # host-side clients outside the compose network.
      KAFKA_BROKERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Mongo/Loki/Tempo are optional at boot (see CLAUDE.md) — left
      # unset here on purpose. Point them at real services via a .env
      # file if you also want to run those.
    ports:
      - "${PORT:-3000}:3000"

  # Separate long-running process consuming account.created and simulating
  # the confirmation email (see src/infra/events/consumers/account-created-
  # consumer.ts) — without this running, published events just sit in the
  # queue unconsumed; the app service alone doesn't do anything with them.
  # Bypasses docker-entrypoint.sh (which always runs migrations + the HTTP
  # server, ignoring any CMD override) via `entrypoint:`, since this process
  # needs neither.
  worker-account-created:
    build: .
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_started
      # Now also load-bearing for this worker specifically (fails fast the
      # same way server.ts does, not non-fatal like rabbitmq above): its
      # retry/DLQ idempotency guard (see docs/resilience.md) reads/writes
      # the same Redis-backed IdempotencyRepository the HTTP-facing
      # decorator uses. service_healthy, matching how the `app` service
      # itself waits on redis below, not just service_started.
      redis:
        condition: service_healthy
    entrypoint: ["npx", "ts-node", "src/infra/events/consumers/account-created-consumer.ts"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # Separate long-running process consuming remittance.completed and
  # indexing into Elasticsearch (see src/infra/events/consumers/
  # remittance-completed-indexer.ts) — same reasoning as
  # worker-account-created above.
  worker-remittance-indexer:
    build: .
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
    entrypoint: ["npx", "ts-node", "src/infra/events/consumers/remittance-completed-indexer.ts"]
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: money-across-borders-remittance-indexer
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # Separate long-running process polling outbox_events (see
  # src/infra/events/consumers/outbox-relay.ts) and relaying unpublished
  # account.created rows to RabbitMQ — the Transactional Outbox's other
  # half. CreateAccountUseCase only ever writes to Postgres now (inside its
  # UnitOfWork transaction); without this running, those rows just sit
  # unpublished and worker-account-created below never sees them. Needs
  # postgres healthy (it polls outbox_events directly, same table
  # CreateAccountUseCase writes to) unlike the other two workers above,
  # which only depend on their broker having started.
  worker-outbox-relay:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    entrypoint: ["npx", "ts-node", "src/infra/events/consumers/outbox-relay.ts"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-scaling_app}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  elasticsearch_data:
